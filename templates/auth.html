<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% if mode == 'login' %}Login{% else %}Sign Up{% endif %} — BBC College AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/main.css"/>
<link rel="stylesheet" href="/static/css/auth.css"/>
</head>
<body class="auth-body">

<div class="auth-bg">
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>
</div>

<div class="auth-container">
  <a href="/" class="auth-back">← Back to Chat</a>

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon-lg">🎓</span>
      <h1 class="auth-brand">BBC College <span class="gradient-text">AI</span></h1>
    </div>

    <div class="auth-tabs">
      <a href="/login" class="auth-tab {% if mode == 'login' %}active{% endif %}">Login</a>
      <a href="/signup" class="auth-tab {% if mode == 'signup' %}active{% endif %}">Sign Up</a>
    </div>

    {% if mode == 'login' %}
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" class="form-input" id="loginPassword" placeholder="Enter password" required autocomplete="current-password"/>
          <button type="button" class="toggle-pw" id="togglePw1">👁</button>
        </div>
      </div>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="btn-submit" id="loginBtn">
        <span class="btn-text">Login</span>
        <span class="btn-spinner" style="display:none">⟳</span>
      </button>
      <p class="auth-hint">Demo admin: admin@bbc.edu.in / admin@123</p>
    </form>
    {% else %}
    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="signupName" placeholder="Your full name" required autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" class="form-input" id="signupPassword" placeholder="Min 6 characters" required autocomplete="new-password"/>
          <button type="button" class="toggle-pw" id="togglePw2">👁</button>
        </div>
      </div>
      <div class="form-error" id="signupError"></div>
      <button type="submit" class="btn-submit" id="signupBtn">
        <span class="btn-text">Create Account</span>
        <span class="btn-spinner" style="display:none">⟳</span>
      </button>
    </form>
    {% endif %}
  </div>
</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
